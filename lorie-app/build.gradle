apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

// Define version variables here or import from a common file
// If you have a root ext, use rootProject.ext.xxx
// Otherwise define them:
def termuxX11NdkVersion = "26.1.10909125"   // example
def termuxX11VersionName = "1.0.0"          // example

android {
    namespace 'com.termux.x11.app'
    compileSdk 34
    ndkVersion termuxX11NdkVersion

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName termuxX11VersionName
        // No applicationId here!
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_9
        targetCompatibility JavaVersion.VERSION_1_9
    }

    // If you need debug signing for local testing of the library, it's not required.
    // Remove signingConfigs completely.
}

dependencies {
    // No dependency on ':app' unless absolutely necessary.
    // Remove or replace with actual library dependencies.
    // Example: implementation 'androidx.appcompat:appcompat:1.6.1'
}

// Publishing configuration
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.yourusername'   // adjust
                artifactId = 'termux-x11-lib'
                version = android.defaultConfig.versionName
            }
        }
    }
}